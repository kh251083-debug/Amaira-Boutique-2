<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Amaira Boutique - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <div class="logo">Amaira Boutique</div>
    <nav class="nav">
        <a href="index.html">Home</a>
    </nav>
</header>

<section class="auth-container">

    <div class="tabs">
        <button class="tab-btn active" onclick="showForm('login')">Login</button>
        <button class="tab-btn" onclick="showForm('signup')">Sign Up</button>
    </div>

    <div id="login" class="form-section">
        <h2>Login</h2>
        <form>
            <input type="email" placeholder="Email">
            <input type="password" placeholder="Password">
            <!-- Missing validation (intentional issue) -->
            <button type="submit">Login</button>
        </form>
        <a href="#">Forgot Password?</a>
    </div>

    <div id="signup" class="form-section hidden">
        <h2>Create Account</h2>
        <form>
            <input type="text" placeholder="Full Name">
            <input type="email" placeholder="Email">
            <input type="password" placeholder="Password">
            <input type="password" placeholder="Confirm Password">
            <!-- Missing validation (intentional issue) -->
            <button type="submit">Create Account</button>
        </form>
    </div>

</section>

<script>
function showForm(form) {
    document.getElementById("login").classList.add("hidden");
    document.getElementById("signup").classList.add("hidden");

    document.getElementById(form).classList.remove("hidden");

    const buttons = document.querySelectorAll(".tab-btn");
    buttons.forEach(btn => btn.classList.remove("active"));
    event.target.classList.add("active");
}

function showLoginMessage(event) {
    event.preventDefault();
    document.getElementById("login-msg").textContent = "Login attempt submitted.";
}

function showSignupMessage(event) {
    event.preventDefault();
    document.getElementById("signup-msg").textContent = "Account creation request submitted.";
}
</script>

</body>
</html>
